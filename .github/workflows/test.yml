name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          if ! command -v jq >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get install -y jq; fi
          fi
      - name: Run tests
        run: bash test/run.sh
