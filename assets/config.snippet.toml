[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
  [
    { token = "$used_fresh", fg = "#a6e3a1" },
    { token = "$used_stale", fg = "#fab387" },
    { token = "$used_old", fg = "#f38ba8" },
  ]
]

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "morgancollins.last-used.cycle-filter"
description = "agents: cycle activity filter"
