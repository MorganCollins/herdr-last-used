id = "morgancollins.last-used"
name = "Last Used"
version = "0.1.0"
# 0.7.5 is the floor for three separate APIs this plugin needs: agent.view.set
# and agent.view.clear, one-shot [[startup]] hooks, and per-token fg styling in
# ui.sidebar.agents.rows. Behaviour was verified against 0.8.2.
min_herdr_version = "0.7.5"
description = "Show when each live agent was last active, colour-coded by age, and filter the Agent sidebar by activity."
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "src/startup.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "src/stamp.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "src/stamp.sh"]

[[actions]]
id = "install-rows"
title = "Add last-used row to the Agent sidebar"
command = ["bash", "src/install-rows.sh"]

[[actions]]
id = "uninstall-rows"
title = "Remove last-used row from the Agent sidebar"
command = ["bash", "src/uninstall-rows.sh"]

[[actions]]
id = "refresh"
title = "Refresh last-used stamps"
command = ["bash", "src/stamp.sh"]

[[actions]]
id = "show-active"
title = "Agents: show active only"
command = ["bash", "src/filter.sh", "active"]

[[actions]]
id = "show-stale"
title = "Agents: show stale only"
command = ["bash", "src/filter.sh", "stale"]

[[actions]]
id = "show-inactive"
title = "Agents: show inactive only"
command = ["bash", "src/filter.sh", "inactive"]

[[actions]]
id = "show-all"
title = "Agents: clear activity filter"
command = ["bash", "src/filter.sh", "all"]
